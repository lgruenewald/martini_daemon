[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "martini_daemon"
authors = []
description = ""
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = []
dependencies = [
  "numpy",
  "openmm",
  "freud-analysis",
  "tqdm",
  "molly@git+https://git.sr.ht/~ma3ke/molly#egg=molly&subdirectory=bindings/python"
]
dynamic = ["version"]

[tool.maturin]
module-name = "martini_daemon.__rust"
features = ["pyo3/extension-module"]

[project.optional-dependencies]
all = [
# Testing
  "pytest",
# Docs
  "sphinx",
  "sphinx-autoapi"
]
