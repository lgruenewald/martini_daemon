[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "martini_daemon"
authors = []
description = ""
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = []
dependencies = [
  "numpy",
  "openmm",
]
dynamic = ["version"]

[tool.maturin]
module-name = "martini_daemon.__rust"
features = ["pyo3/extension-module"]
python-source = "."

[tool.ruff.lint]
extend-select = [
  "F", # Pyflakes
  "I", # Import sorting
  "UP", # Warn on older python features such as %
  "C4", # flag unneccessary iteration patterns
  "RET", # warn on useless else blocks and explicit "return None"
  "SIM", # simplifications
  "ANN", # missing type annotations
  "D" # warn on missing documentation
]

[project.optional-dependencies]

test = [
  "pytest",
  "mdtraj"
]

docs = [
  "sphinx",
  "sphinx-autoapi",
  "sphinx-rtd-theme"
]

dev = [
  "python-lsp-server",
  "ruff",
  "ty"
]

molly = [
  "molly@git+https://git.sr.ht/~ma3ke/molly#egg=molly&subdirectory=bindings/python",
]
