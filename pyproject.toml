[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "martini_daemon"
authors = [
  { name = "Linus Grünewald" },
  { name = "Aster Kovács" },
  { name = "Siewert J Marrink" }
]
description = "Template based reactions in OpenMM MD simulations using the Martini force field."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "martini",
  "MD",
  "OpenMM",
  "chemistry",
  "molecular dynamics",
  "reactive simulations"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: GPU",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "numpy>=2.4,<3",
  "openmm>=8.5.2,<9",
  "molly@git+https://github.com/ma3ke/molly#egg=molly&subdirectory=bindings/python",
]
dynamic = ["version"]

[project.scripts]
daemon = "martini_daemon.__main:main"

[tool.maturin]
module-name = "martini_daemon.__rust"
features = ["pyo3/extension-module"]
python-source = "."

[tool.ruff.lint]
extend-select = [
  "F", # Pyflakes
  "I", # Import sorting
  "UP", # Warn on older python features such as %
  "C4", # flag unneccessary iteration patterns
  "RET", # warn on useless else blocks and explicit "return None"
  "SIM", # simplifications
  "ANN", # missing type annotations
  "D" # warn on missing documentation
]
ignore = [
  "D203", # we want to blank lines after class
  "D212", # we want a formally "empty" line after """ in docstrings
]

[project.optional-dependencies]

test = [
  "pytest",
  "mdtraj",
]

docs = [
  "sphinx",
  "sphinx-autoapi",
  "sphinx-rtd-theme",
  "myst-parser"
]

dev = [
  "python-lsp-server",
  "ruff",
  "ty"
]

trr = [
  "mdtraj"
]
