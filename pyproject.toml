[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "martini_daemon"
authors = []
description = ""
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = []
dependencies = [
  "numpy",
  "openmm",
]
dynamic = ["version"]

[tool.maturin]
module-name = "martini_daemon.__rust"
features = ["pyo3/extension-module"]
python-source = "."

[project.optional-dependencies]

test = [
  "pytest"
]

docs = [
  "sphinx",
  "sphinx-autoapi",
  "sphinx-rtd-theme"
]

dev = [
  "python-lsp-server",
  "ruff",
  "ty"
]
